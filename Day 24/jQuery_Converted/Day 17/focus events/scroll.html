<!DOCTYPE html>
<html>
<head>
    <title>Scroll Event</title>
    <style>
        body { height: 2000px; } /* Make the page tall enough to scroll */
    </style>
</head>
<body>
    <h1>Scroll Event</h1>
    <p>Scroll down the page to trigger the event.</p>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
        window.scroll(function() {
            console.log("You scrolled the page!");
        });
    </script>
</body>
</html>
