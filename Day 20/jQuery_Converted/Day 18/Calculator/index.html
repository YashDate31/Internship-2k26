<!DOCTYPE html>
<html>

<head>
    <title>
        Smart Calculator
    </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #main {
            width: 400px;
            height: 800px;
            background-color: #000;
            margin: 0 20%;
            margin-top: 100px;
            border-radius: 10px;

        }

        #display {
            width: 100%;
            height: 100px;
            background-color: #ffffff;
            border-radius: 10px;
            padding: 10px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);

        }

        #keys {
            width: 100%;
            height: 700px;
            display: flex;

            flex-wrap: wrap;
        }

        .buttons {
            width: 25%;
            padding: 10px;
            margin: 5px;
            height: 75px;
            background-color: #9e9b9b;
            display: flex;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            overflow: hidden;
        }
    </style>
</head>

<body style="background-color: #774a4a;">
    <div id="main">
        <div id="display"></div>
        <div id="keys">
            <div class="buttons">C</div>
            <div class="buttons">DEL</div>
            <div class="buttons">%</div>
            <div class="buttons">/</div>
            <div class="buttons">7</div>
            <div class="buttons">8</div>
            <div class="buttons">9</div>
            <div class="buttons">*</div>
            <div class="buttons">4</div>
            <div class="buttons">5</div>
            <div class="buttons">6</div>
            <div class="buttons">-</div>
            <div class="buttons">1</div>
            <div class="buttons">2</div>
            <div class="buttons">3</div>
            <div class="buttons">+</div>
            <div class="buttons">0</div>
            <div class="buttons">.</div>
            <div class="buttons">=</div>
        </div>
    </div>

</body>

</html>
