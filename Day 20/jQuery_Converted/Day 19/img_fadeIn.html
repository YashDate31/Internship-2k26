<!DOCTYPE html>
<html>

<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#btn").click(function () {
                $("#img").fadeIn(1000);
            });
        });
    </script>
</head>

<body>
    <button id="btn">Click me to fadein img</button>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1V-eZ_ggCX1_0wJY3l4biv3ZVYl7M_aNuZ7xrPAplfg&s=10" id="img" style="display: none;">
</body>

</html>
