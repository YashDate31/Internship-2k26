<!DOCTYPE html>
<html>
<head>
    <title>Keyup Event</title>
</head>
<body>
    <h1>Keyup Event</h1>
    <p>Fires when a key is released.</p>
    <input type="text" id="inputField" placeholder="Type and release key">
    <p id="output"></p>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>$(document).ready(function() {

        $("#inputField").keyup(function(event) {
            $("#output").innerText = 'Key released: ' + event.key;
        });
    
});</script>
</body>
</html>
