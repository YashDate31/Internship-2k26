<!DOCTYPE html>
<html>
<head>
    <title>Keydown Event</title>
</head>
<body>
    <h1>Keydown Event</h1>
    <p>Fires when a key is pressed down.</p>
    <input type="text" id="inputField" placeholder="Press any key">
    <p id="output"></p>
    <script>
        document.getElementById('inputField').addEventListener('keydown', function(event) {
            document.getElementById('output').innerText = 'Key pressed: ' + event.key;
        });
    </script>
</body>
</html>
