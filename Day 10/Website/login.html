<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to ShopKing — India's #1 Shopping Platform">
  <title>Login – ShopKing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brand-orange: #FF9900;
      --brand-orange-dark: #e68a00;
      --bg-dark: #0d1117;
      --bg-card: #1e2a3a;
      --text-muted: #8b95a8;
      --glass-border: rgba(255, 153, 0, 0.2);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #131921 50%, #1a2332 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-y: auto;
      background-attachment: fixed;
      color: #e8eaf0;
    }

    /* Background glows */
    body::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,153,0,0.12) 0%, transparent 70%);
      border-radius: 50%;
      top: -150px; left: -150px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,153,0,0.08) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -100px; right: -80px;
      pointer-events: none;
    }

    .login-card {
      background: rgba(30, 42, 58, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 44px 38px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      position: relative;
      z-index: 2;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      width: 58px; height: 58px;
      background: linear-gradient(135deg, #FF9900, #ffbe55);
      color: #111;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(255,153,0,0.4);
      margin-bottom: 12px;
    }

    .login-logo h1 {
      font-size: 1.8rem;
      font-weight: 900;
      color: white;
      letter-spacing: -0.5px;
    }
    .login-logo h1 span { color: var(--brand-orange); }

    .login-logo p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s;
    }

    .tab-btn.active {
      background: var(--brand-orange);
      color: #111;
      box-shadow: 0 2px 10px rgba(255,153,0,0.3);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Form Controls */
    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      color: white;
      transition: all 0.25s;
      background: rgba(13, 17, 23, 0.8);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--brand-orange);
      background: rgba(13, 17, 23, 0.95);
      box-shadow: 0 0 0 3px rgba(255,153,0,0.2);
    }

    .form-group input::placeholder { color: rgba(139, 149, 168, 0.6); }

    .password-wrap { position: relative; }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .forgot-link {
      text-align: right;
      margin-top: 6px;
    }

    .forgot-link a {
      font-size: 0.85rem;
      color: var(--brand-orange);
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-link a:hover { text-decoration: underline; }

    .btn-email-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #FF9900, #e68a00);
      color: #111;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s;
      box-shadow: 0 4px 15px rgba(255,153,0,0.3);
      margin-top: 8px;
    }

    .btn-email-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,153,0,0.45);
    }

    .btn-email-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 13px;
      background: rgba(255,255,255,0.06);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s;
    }

    .btn-google:hover {
      background: rgba(255,153,0,0.12);
      border-color: var(--brand-orange);
      color: var(--brand-orange);
      transform: translateY(-2px);
    }

    .btn-google img {
      width: 20px;
      height: 20px;
    }

    /* Message */
    .message {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
    }

    .message.error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      display: block;
    }

    .message.success {
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.4);
      color: #6ee7b7;
      display: block;
    }

    .back-home {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
    }

    .back-home a {
      color: var(--brand-orange);
      font-weight: 700;
      text-decoration: none;
    }

    .back-home a:hover { text-decoration: underline; }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .login-card { padding: 32px 20px; }
      .login-logo h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
      </div>
      <h1>Shop<span>King</span></h1>
      <p>India's #1 Shopping Platform</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Message -->
    <div class="message" id="message"></div>

    <!-- ===== LOGIN FORM ===== -->
    <div class="tab-content active" id="content-login">
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="login-password" placeholder="Enter your password" required>
            <button type="button" class="toggle-pw" onclick="togglePw('login-password', this)">👁</button>
          </div>
          <div class="forgot-link"><a href="#" onclick="resetPassword()">Forgot password?</a></div>
        </div>
        <button class="btn-email-login" type="submit" id="login-btn">Login to Account</button>
      </form>

      <div class="divider">or continue with</div>

      <button class="btn-google" id="google-login-btn">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
        Continue with Google
      </button>
    </div>

    <!-- ===== REGISTER FORM ===== -->
    <div class="tab-content" id="content-register">
      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="Yash Patil" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="reg-password" placeholder="Min 6 characters" required>
            <button type="button" class="toggle-pw" onclick="togglePw('reg-password', this)">👁</button>
          </div>
        </div>
        <button class="btn-email-login" type="submit" id="register-btn">Create Account</button>
      </form>

      <div class="divider">or continue with</div>

      <button class="btn-google" id="google-register-btn">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
        Sign Up with Google
      </button>
    </div>

    <div class="back-home"><a href="index.html">← Back to Home</a></div>
  </div>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const provider = new GoogleAuthProvider();

    // If already logged in, redirect to profile
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = "profile.html";
    });

    /* ---- Helpers ---- */
    function showMessage(text, type = "error") {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = `message ${type}`;
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> Please wait...`;
      } else {
        btn.disabled = false;
        btn.textContent = btnId === "login-btn" ? "Login to Account" : "Create Account";
      }
    }

    /* ---- Email Login ---- */
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      setLoading("login-btn", true);
      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMessage("Login successful! Redirecting…", "success");
        setTimeout(() => window.location.href = "profile.html", 1000);
      } catch (err) {
        showMessage(friendlyError(err.code));
        setLoading("login-btn", false);
      }
    });

    /* ---- Email Register ---- */
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("reg-name").value;
      const email = document.getElementById("reg-email").value;
      const password = document.getElementById("reg-password").value;
      setLoading("register-btn", true);
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
        showMessage("Account created! Redirecting…", "success");
        setTimeout(() => window.location.href = "profile.html", 1000);
      } catch (err) {
        showMessage(friendlyError(err.code));
        setLoading("register-btn", false);
      }
    });

    /* ---- Google Auth ---- */
    async function googleSignIn() {
      try {
        await signInWithPopup(auth, provider);
        window.location.href = "profile.html";
      } catch (err) {
        showMessage(friendlyError(err.code));
      }
    }

    document.getElementById("google-login-btn").addEventListener("click", googleSignIn);
    document.getElementById("google-register-btn").addEventListener("click", googleSignIn);

    /* ---- Password Reset ---- */
    window.resetPassword = async () => {
      const email = document.getElementById("login-email").value;
      if (!email) { showMessage("Enter your email first to reset password."); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        showMessage("Reset link sent! Check your inbox.", "success");
      } catch (err) {
        showMessage(friendlyError(err.code));
      }
    };

    /* ---- Tab switch ---- */
    window.switchTab = (tab) => {
      document.getElementById("tab-login").classList.toggle("active", tab === "login");
      document.getElementById("tab-register").classList.toggle("active", tab === "register");
      document.getElementById("content-login").classList.toggle("active", tab === "login");
      document.getElementById("content-register").classList.toggle("active", tab === "register");
      document.getElementById("message").className = "message";
    };

    /* ---- Toggle password visibility ---- */
    window.togglePw = (id, btn) => {
      const input = document.getElementById(id);
      if (input.type === "password") { input.type = "text"; btn.textContent = "🙈"; }
      else { input.type = "password"; btn.textContent = "👁"; }
    };

    /* ---- Friendly Firebase errors ---- */
    function friendlyError(code) {
      const map = {
        "auth/invalid-email": "Invalid email address.",
        "auth/user-not-found": "No account found with this email.",
        "auth/wrong-password": "Wrong password. Try again.",
        "auth/email-already-in-use": "This email is already registered. Please login.",
        "auth/weak-password": "Password must be at least 6 characters.",
        "auth/popup-closed-by-user": "Sign-in popup was closed. Please try again.",
        "auth/network-request-failed": "Network error. Check your internet connection.",
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/too-many-requests": "Too many attempts. Please wait and try again.",
      };
      return map[code] || "Something went wrong. Please try again.";
    }
  </script>

</body>
</html>
