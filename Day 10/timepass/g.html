<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <style>
        
        #one {
            background-color: red;
            height: 80%;      
            width: 50%;      
            display: flex;        
            align-items: center;
            justify-content: space-around; 
        }

        #two {
            background-color: rgb(16, 80, 30);
            height: 70%;       
            width: 20%;        
        }

        #three {
            background-color: blue;
            height: 20%;      
            width: 60%;        
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="one">
        <div id="two"></div>
        <div id="three"></div>
    </div>
</body>
</html>
