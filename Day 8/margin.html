<!DOCTYPE html>
<html>
    <head>
        <title>Nested div</title>

        
         <style>
        
            #one{
                width: 600px;
                height: 600px;
                background-color: rgb(165, 137, 137);
                margin: 20px ;
                padding: 20px;

            }

            .rainbow {
                width: 100%;
                height: 100%;
                display:flex;
                align-items: center; 
                gap:15px; 
            }

            .box {
                width: 320px;
                height: 60px;
                border-radius: 16px;

            }

            .red    { background: #ff4b4b; }
            .orange { background: #ff914d; }
            .yellow { background: #ffd24a; }
            .green  { background: #7be495; }
            .blue   { background: #4aa3ff; }
        
        </style>
    </head>
    <body>
        <div id="one">
            <div class="rainbow">
                <div class="box pink"></div>
                <div class="box red"></div>
                <div class="box orange"></div>
                <div class="box yellow"></div>
                <div class="box green"></div>
                <div class="box blue"></div>
            </div>
        </div>
    </body>
