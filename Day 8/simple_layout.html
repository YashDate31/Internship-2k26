<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Layout</title>
  <style>
   
    #one {
      background: bisque;
      width: 100%;
      min-height: 140px;
      display: flex;           
      align-items: center;    
      gap: 20px;                
      padding: 20px;
      
    }

    #two {
      background: red;
      width: 140px;
      height: 90px;
      overflow:hidden;
      border-radius: 300px;
      margin-left: 20px;
    }

    #three {
      background: greenyellow;
      height: 100px;
      border-radius: 10px;
      padding: 10px;
      width:100%;
      overflow:hidden;
      background-image: linear-gradient(to bottom,rgb(47, 161, 127),rgb(127, 127, 192));
      color: rgb(221, 22, 58);
      

    }
    #two img {
      width: 100%;
      height: 100%;
      object-fit:cover;
    }


  </style>
</head>
<body>
  <div id="one">
    <div id="two"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkQZwfIF1UdjlMBtjg4fmlfdGU0suXMgG5qA&s" alt="logo"></div>
    <div id="three"><h1>Amazon </h1></div>
  </div>

</body>
</html>
