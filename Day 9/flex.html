<!DOCTYPE html>
<html>
    <head>
        <title>Grid Example</title>
        <style>
            .grid {
                display: flex;
                padding: 20px;
                gap:10px

            }
            .box {
                background: #4CAF50;
                color: #fff;
                padding: 24px;
                border-radius: 8px;
                display: flex;
                align-items: center;
                font-size: 18px;
            }
           
        </style>
    </head>
    <body>
        <h2 >Simple CSS Grid</h2>
        <div class="grid">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </body>
</html>
