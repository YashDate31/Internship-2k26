<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Layout</title>
  <style>
   
    #one {
      background: bisque;
      width: 100%;
      min-height: 140px;
      display: flex;           
      align-items: center;    
      gap: 20px;                
      padding: 20px;
      
      
    }

    #two {
      background: red;
      width: 140px;
      height: 90px;
      overflow:hidden;
      border-radius: 300px;
      margin-left: 20px;
    }

    #three {
      background: greenyellow;
      height: 100px;
      border-radius: 10px;
      padding: 10px;
      width:100%;
      overflow:hidden;
      background-image: linear-gradient(to bottom,rgb(47, 161, 127),rgb(127, 127, 192));
      color: rgb(221, 22, 58);
      font-size:25px;

    }
    h1{
    }
    #two img {
      width: 100%;
      height: 100%;
      object-fit:cover;
    }


    .navbar {
      display: grid;
      align-items: center;
      padding: 12px;
      background: #2d2c2c;
      color: #b08888;
    }
    .nav-links 
    { 
        display: flex; 
        gap: 130px;
    }
    .nav-links a { color: #f0f9ed; text-decoration: none; }
    .nav-links a:hover {  background-color: rgba(208, 255, 232, 0.06); }

  </style>
</head>
<body>
  


  <div id="one">
    <div id="two"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkQZwfIF1UdjlMBtjg4fmlfdGU0suXMgG5qA&s" alt="logo"></div>
    <div id="three"><h1>Amazon </h1></div>
  </div>
    <nav class="navbar">
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </div>
  </nav>
</body>
</html>
