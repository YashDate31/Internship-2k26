<!DOCTYPE html>
<html>
    <head>
        <title>
            Layout 3
        </title>
        <style>
            #one{
                background-color: blue;
                height: 600px;
                width:800px;
                display: grid;
                grid-template-columns: repeat/(1,60px,1fr);
            }
            #two{
                background-color: palevioletred;
                height: 380px;
                width:240px;
                margin-left: 40px;
                margin-top: 100px;
                margin-bottom:100px
                
            }

            .box{
                height: 50px;
                width: 300px;
                background-color: rgb(143, 7, 255);
                margin-left: 300px;
                padding:12px;
                margin:30px;
                margin-left: 300px;



             
            }
        </style>
    </head>

    <body>
        <div id="one">
            <div id="two">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>

            </div>
            <div id="content">
            </div>
        </div>

    </body>


</html>
