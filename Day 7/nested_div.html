<!DOCTYPE html>
<html>
    <head>
        <title>Nested div</title>

        
         <style>
        
            #one{
                width: 700px;
                background-color: rgb(165, 137, 137);
                padding: 28px;      
            }

            #two {
                width: 75%;
                max-width: 500px;
                background-color: azure;
                margin: 0 auto;        
                padding: 18px;        
                text-align: center;
            }
        
        </style>
    </head>
    <body>
        <div id="one">
            <div id="two">
                <h2>Hello</h2>
            </div>
        </div>
    </body>
