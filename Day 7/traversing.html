<!DOCTYPE html>
<html>
    <head>
        <title>Traversing</title>
        <style>
          
          #one{
            color: blue;

          }
           
          /* direct child */

            div >p 
            {
                color:pink
            }

        </style>
    </head>

    <body>

        <h2>Traversing in css</h2>
        <div id="one">
             Sequence
            <p>Inside the div
                <p>INSIDE P</p>
            </p>
            <p>Same as above</p>
            <span><p>in side span</p></span>
           
        </div>

    </body>

</html>
