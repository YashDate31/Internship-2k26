<!DOCTYPE html>
<html>
    <head>
        <title>Form using table</title>
    </head>

    <body>
         <form name="Register" method="post" action="#" id="profile" enctype="multipart/form-data">
            <fieldset>
                <legend>Login Form</legend>
            <table >

                <tr>
                    <td><br><label>Username</label></td>
                    <td><br><input type="text" name="Username" id="Username" placeholder="Enter Your Username  " value=""></td>
                </tr>
                <tr>
                  <td><br><label>Password:</label></td>
                    <td><br><input type="password" name="pass" id="pass" placeholder="Enter password" value=""></td>
                </tr>

                <tr>
                    <td colspan="2"><br><br><center><input type="submit" value="submit"> <input type="reset" value="reset"></center></td>
                </tr>
            </table>

             <pre style="align-items: left;"><a href="registeration.html">new user?</a></pre>
                        </fieldset>

                       

         </form>


    </body>
</html>
