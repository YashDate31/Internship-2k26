<!DOCTYPE html>
<html>
    <head>
        <title>Form Example</title>
    </head>

    <body>
        <form name="Register" method="post" action="#" id="profile" enctype="multipart/form-data">

            <fieldset><legend>Form Example</legend>
                 <label>Name: </label>
                 <input type="text" name="name" id="fname" placeholder="Enter Your Name  " value="">

           <br><br> <label>Email</label>
                <input type="text" name="Email" id="Email" placeholder="Enter Your Email: " value="">

           <br> <br><label>Password:</label>
                <input type="password" name="pass" id="pass" placeholder="Enter password" value="">

           <br> <br><label>Date of Birth</label>
                <input type="date" name="dob" id="dob" value="">
            
           <BR><br><label>Address:</label>
           <br> <textarea name="addresss" id="addresss" rows="5" cols="12" value=""></textarea>

           <BR> <br><label>Gender</label>
                <input type="radio" id="g1" name="gender" value="male">male
                <input type="radio" id="g2" name="gender" value="Female">Female

          <br>  <br><label>Qualification</label>
            <input type="checkbox" id="cb1" name="cb" value="ssc">ssc
            <input type="checkbox" id="cb2" name="cb" value="hhc">hhc

           <BR> <br><label>Blood Group</label>
                <select name="bg" id="bg1">
                    <option value="A+">A+</option>
                    <option value="B+">B+</option>
                </select>

           <br> <br><label>Upload file</label>
                <input type="file" name="file_upload" id="f1">

            <BR><br><input type="submit" value="submit"> <input type="reset" value="reset">


            
            
            

     
          </fieldset>      
        </form>

    </body>
</html>
