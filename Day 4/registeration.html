<!DOCTYPE html>
<html>
    <head>
        <title>Form using table</title>
    </head>

    <body>
         <form name="Register" method="post" action="#" id="profile" enctype="multipart/form-data">
            <fieldset>
                <legend>Register Form</legend>
            <table >

                <tr>
                    <td><br><br><label>Name</label></td>
                    <td><br><br><input type="text" name="Username" id="Username" placeholder="Enter Your Username  " value=""></td>
                </tr>
                <tr>
                    <td> <br><br><label>Email</label></td>
                <td><br><br><input type="text" name="Email" id="Email" placeholder="Enter Your Email: " value="">
</td>
                </tr>
                <tr>
                  <td><br><br><label>Password:</label></td>
                    <td><br><br><input type="password" name="pass" id="pass" placeholder="create password" value=""></td>
                </tr>
                  <tr>
                  <td><br><br><label>Password confrom:</label></td>
                    <td><br><br><input type="password" name="pass" id="pass1" placeholder="comform your password" value=""></td>
                </tr>


              <tr>
                    <td colspan="2"><br><br><center><input type="submit" value="submit"> <input type="reset" value="reset"></center></td>
                </tr>
            </table>
                        </fieldset>

         </form>


    </body>
</html>
