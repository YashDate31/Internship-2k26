<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout 2</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #one {
            background-color: red;
            height: 45%;         
            width: 80%;          
            margin-bottom: 2%;   
            display: flex;
            align-items: center; 
            justify-content: space-around; 
        }

        #four {
            background-color: red; 
            height: 45%;         
            width: 80%;          
            display: flex;
            align-items: center; 
            justify-content: space-around; 
        }

        #two {
            background-color: green;
            height: 70%;         
            width: 20%;          
        }

        #three {
            background-color: blue;
            height: 40%;         
            width: 35%;          
        }

        #five {
            background-color: blue;
            height: 40%;         
            width: 35%;          
        }

        #six {
            background-color: green;
            height: 70%;         
            width: 20%;          
        }
    </style>
</head>

<body>
    <div id="one">
        <div id="two"></div>
        <div id="three"></div>
    </div>

    <div id="four">
        <div id="five"></div>
        <div id="six"></div>
    </div>
</body>    
</html>
